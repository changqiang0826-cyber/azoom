<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | AZoom</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <a class="logo" href="index.html"><img src="images/logo.png" alt="AZoom logo"></a>
    <nav class="menu">
      <a href="index.html">Home</a>
      <a href="cars.html">Cars</a>
      <a href="booking.html">Book</a>
      <a href="orders.html">My Orders</a>
      <a href="locations.html">Locations</a>
      <a href="login.html" id="auth-link">Login</a>
    </nav>
  </header>

  <main>
    <section class="section narrow small">
      <h2>Create Account</h2>
      <form id="register-form" class="form">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" required>
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required>
        <label for="reg-password">Password (at least 6 characters)</label>
        <input type="password" id="reg-password" minlength="6" required>
        <p class="error" id="reg-error"></p>
        <button type="submit" class="btn">Create Account</button>
      </form>
      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-grid">
      <div>
        <h4>AZoom</h4>
        <p>Electric car rental for visitors to Singapore.</p>
      </div>
      <div>
        <h4>Stores</h4>
        <p>Changi Airport T3, Arrival Hall</p>
        <p>Woodlands Checkpoint</p>
      </div>
      <div>
        <h4>Contact</h4>
        <p>hello@azoom.sg</p>
        <p>+65 6000 0000</p>
      </div>
    </div>
    <p class="copy">&copy; 2026 AZoom. A student project for ISIT207.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
