<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff | AZoom</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="topbar">
    <a class="logo" href="../index.html"><img src="../images/logo.png" alt="AZoom logo"></a>
    <nav class="menu">
      <span class="hello">Staff Area</span>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main>
    <section class="section">
      <h2>Cars Waiting for Inspection</h2>
      <div id="inspect-list"></div>
    </section>

    <section class="section">
      <h2>All Bookings</h2>
      <div class="tablewrap">
        <table class="admin-table">
          <thead>
            <tr><th>Customer</th><th>Car</th><th>Dates</th><th>Return Point</th><th>Total (S$)</th><th>Status</th></tr>
          </thead>
          <tbody id="all-bookings"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
